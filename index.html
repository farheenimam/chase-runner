<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rang Chase</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
        color: #e8ecf1;
        font: 13px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
        white-space: pre;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0d10;
        transition: opacity 0.35s;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="loading">loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
