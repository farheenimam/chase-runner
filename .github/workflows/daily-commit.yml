name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'  # runs every day at 00:00 UTC
  workflow_dispatch:      # lets you trigger it manually from Actions tab

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update log file
        run: |
          mkdir -p .github/daily-log
          echo "Commit on $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .github/daily-log/log.md

      - name: Commit and push
        run: |
          git config user.name "Farheen Imam"
          git config user.email "115992935+farheenimam@users.noreply.github.com"
          git add .github/daily-log/log.md
          git commit -m "chore: daily commit $(date -u +'%Y-%m-%d')" || exit 0
          git push
