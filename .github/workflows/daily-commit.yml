name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make random commits
        run: |
          git config user.name "Farheen Imam"
          git config user.email "115992935+farheenimam@users.noreply.github.com"
          mkdir -p .github/daily-log
          COUNT=$((RANDOM % 6 + 1))
          echo "Making $COUNT commits"
          for i in $(seq 1 $COUNT); do
            echo "Commit $i on $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .github/daily-log/log.md
            git add .github/daily-log/log.md
            git commit -m "chore: daily log $(date -u +'%Y-%m-%d') #$i"
            sleep 1
          done
          git push
